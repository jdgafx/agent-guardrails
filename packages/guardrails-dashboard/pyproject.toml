[project]
name = "guardrails-dashboard"
version = "0.1.0"
description = "A local, read-only server for the agent-guardrails dashboard page (index.html)."
requires-python = ">=3.9"
dependencies = ["guardrails-core"]

[tool.uv.sources]
guardrails-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrails_dashboard"]
