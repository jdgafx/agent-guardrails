[project]
name = "guardrails-demo"
version = "0.1.0"
description = "Fixtures of risky tool calls and a replay runner for agent-guardrails."
requires-python = ">=3.9"
dependencies = ["guardrails-core"]

[tool.uv.sources]
guardrails-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrails_demo"]
