[project]
name = "agent-guardrails-workspace"
version = "0.1.0"
description = "Workspace root for agent-guardrails (not published)."
requires-python = ">=3.9"
dependencies = ["guardrails-core", "guardrails-demo"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
guardrails-core = { workspace = true }
guardrails-demo = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/guardrails-core/src", "packages/guardrails-demo/src"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["packages/guardrails-plugin/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# The acceptance check file is owned by the ticket check and is not reformatted.
"tests/acceptance/*" = ["E501"]
